name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          VITE_DEPLOY_TARGET: github-pages
          GITHUB_PAGES: true
          VITE_APP_PUBLIC_URL: https://faiqali-dot.github.io/tapEarn
          VITE_TELEGRAM_BOT_USERNAME: YORZAEARNBOT
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node scripts/prebuild-manifest.mjs
          npm run build
          node scripts/copy-404.mjs

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
